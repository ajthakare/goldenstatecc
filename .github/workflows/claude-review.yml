# Automatic AI review on every non-draft PR. Required status check on main:
# the job fails unless Claude's verdict is PASS.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out in the working directory.
            Read CLAUDE.md first and enforce its rules. Note that parts of CLAUDE.md are
            stale, so verify claims against the actual code.

            Focus on:
            - Correctness bugs and regressions
            - Security: admin Netlify functions must call isAdmin (validateAdminSession
              alone also accepts members); no debug/migration scripts under
              netlify/functions/ or anything from local-debug/
            - Data-integrity risks to Netlify Blobs (lost writes, wrong keys, destructive changes)
            Skip style nitpicks and anything a linter would catch.

            Use mcp__github_inline_comment__create_inline_comment (with confirmed: true)
            for specific issues, and post exactly one summary with `gh pr comment` at the end.
            Only post GitHub comments - don't submit review text as messages.

            Finally, write a file named review-verdict.txt in the working directory containing
            exactly PASS, or BLOCK if you found any bug that must be fixed before merging.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob,Write"

      - name: Enforce verdict
        run: |
          verdict=$(tr -d '[:space:]' < review-verdict.txt 2>/dev/null || echo MISSING)
          echo "Claude verdict: ${verdict:-MISSING}"
          [ "$verdict" = "PASS" ]
