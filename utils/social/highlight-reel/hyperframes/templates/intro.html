<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
/*__COMMON_CSS__*/
      #bgvid { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 50% 40%; }
      #scrim {
        background:
          radial-gradient(ellipse 70% 38% at 18% 20%, rgba(150, 30, 25, 0.55), transparent 70%),
          radial-gradient(ellipse 60% 30% at 88% 78%, rgba(212, 175, 55, 0.18), transparent 70%),
          linear-gradient(180deg, rgba(14, 9, 8, 0.80) 0%, rgba(14, 9, 8, 0.52) 36%, rgba(14, 9, 8, 0.58) 62%, rgba(14, 9, 8, 0.90) 100%);
      }
      #club { top: 256px; font-size: 24px; font-weight: 700; letter-spacing: 0.22em; color: var(--gold-soft); }
      #rule { position: absolute; top: 300px; left: 430px; width: 220px; height: 2px; background: var(--gold-accent); }
      #crests { top: 326px; }
      #pill {
        position: absolute; top: 566px; left: 340px; width: 400px; padding: 14px 0; border-radius: 40px; text-align: center;
        font-size: 24px; font-weight: 800; letter-spacing: 0.2em; color: #fff; white-space: nowrap;
        background: linear-gradient(180deg, var(--maroon-hover), var(--maroon-dark)); border: 2px solid rgba(233, 200, 107, 0.65);
      }
      .team { font-weight: 900; color: var(--pure-white); line-height: 1; white-space: nowrap; text-shadow: 0 6px 28px rgba(0, 0, 0, 0.55); letter-spacing: -0.01em; }
      #teamA { top: 676px; }
      #vs { top: 800px; height: 34px; }
      #vs span { display: inline-block; font-size: 28px; font-weight: 800; letter-spacing: 0.2em; color: var(--gold-soft); }
      #vs i { position: absolute; top: 16px; width: 200px; height: 2px; background: var(--gold-accent); }
      #vs i.l { left: 284px; transform-origin: 100% 50%; }
      #vs i.r { left: 596px; transform-origin: 0% 50%; }
      #teamB { top: 856px; }
      #meta { top: 1000px; font-size: 31px; font-weight: 600; color: var(--gold-soft); }
      #venue { top: 1046px; font-size: 25px; font-weight: 500; color: var(--muted-text); }
      #hook {
        position: absolute; top: 1100px; left: 0; height: 86px; padding: 0 56px; border-radius: 44px; overflow: hidden;
        display: flex; align-items: center; justify-content: center; white-space: nowrap;
        font-size: 42px; font-weight: 900; letter-spacing: 0.08em; color: #14100e;
        background: linear-gradient(180deg, var(--gold-soft), var(--gold-accent)); box-shadow: 0 10px 34px rgba(0, 0, 0, 0.45);
      }
      #shine { position: absolute; top: 0; left: -140px; width: 90px; height: 100%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.65), transparent); }
      #foot { top: 1384px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920">
      <div id="bgbase" class="layer bg-intro clip" data-start="0" data-duration="__DURATION__" data-track-index="0"></div>
      <video id="bgvid" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="1" src="assets/bg.mp4" muted playsinline></video>
      <div id="scrim" class="layer clip" data-start="0" data-duration="__DURATION__" data-track-index="2"></div>
      <div id="club" class="abs clip" data-start="0" data-duration="__DURATION__" data-track-index="3"></div>
      <div id="rule" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="3"></div>
      <div id="crests" class="abs clip" data-start="0" data-duration="__DURATION__" data-track-index="4"></div>
      <div id="pill" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="5">MATCH HIGHLIGHTS</div>
      <div id="teamA" class="abs team clip" data-start="0" data-duration="__DURATION__" data-track-index="6"></div>
      <div id="vs" class="abs clip" data-start="0" data-duration="__DURATION__" data-track-index="7"><i class="l"></i><span>VS</span><i class="r"></i></div>
      <div id="teamB" class="abs team clip" data-start="0" data-duration="__DURATION__" data-track-index="8"></div>
      <div id="meta" class="abs clip" data-start="0" data-duration="__DURATION__" data-track-index="9"></div>
      <div id="venue" class="abs clip" data-start="0" data-duration="__DURATION__" data-track-index="9"></div>
      <div id="hook" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="10"><span id="hooktext"></span><div id="shine"></div></div>
      <div id="foot" class="abs foot clip" data-start="0" data-duration="__DURATION__" data-track-index="11"></div>
    </div>
    <script>
/*__CARD_DATA__*/
/*__COMMON_JS__*/
      const D = C.duration;
      $("club").textContent = C.club;
      $("crests").appendChild(crestImgs(C.crests, 190));
      $("teamA").textContent = C.teamA;
      $("teamB").textContent = C.teamB || "";
      if (!C.teamB) { $("vs").style.display = "none"; $("teamB").style.display = "none"; }
      $("meta").textContent = C.meta || "";
      $("venue").textContent = C.venue || "";
      $("foot").innerHTML = esc(C.handle) + " &nbsp;•&nbsp; " + esc(C.website);
      if (!C.hasBg) { $("bgvid").style.display = "none"; $("scrim").style.display = "none"; }

      // balanced team stack: both lines use the smaller of the two fitted sizes
      const A = $("teamA"), B = $("teamB");
      const sA = (A.style.display = "inline-block", A.style.width = "auto", fit(A, 900, 104, 46));
      const sB = C.teamB ? (B.style.display = "inline-block", B.style.width = "auto", fit(B, 900, 104, 46)) : sA;
      const size = Math.min(sA, sB);
      for (const n of [A, B]) { n.style.fontSize = size + "px"; n.style.display = "block"; n.style.width = "1080px"; n.style.left = "0"; }
      if (!C.teamB) B.style.display = "none";
      const hook = $("hook");
      if (!C.hook) { hook.style.display = "none"; }
      else {
        $("hooktext").textContent = C.hook;
        hook.style.left = Math.round((1080 - hook.offsetWidth) / 2) + "px";
      }

      const tl = gsap.timeline({ paused: true });
      if (C.hasBg) tl.fromTo("#bgvid", { scale: 1.0 }, { scale: 1.09, duration: D, ease: "none" }, 0);
      tl.fromTo("#club", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.0);
      tl.fromTo("#rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.08);
      tl.fromTo("#crests", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, 0.05);
      tl.fromTo("#pill", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.25);
      tl.fromTo("#teamA", { opacity: 0, x: -260 }, { opacity: 1, x: 0, duration: 0.5, ease: "power4.out" }, 0.3);
      tl.fromTo("#vs span", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.5);
      tl.fromTo("#vs i.l", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.52);
      tl.fromTo("#vs i.r", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.52);
      tl.fromTo("#teamB", { opacity: 0, x: 260 }, { opacity: 1, x: 0, duration: 0.5, ease: "power4.out" }, 0.55);
      tl.fromTo("#meta", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.7);
      tl.fromTo("#venue", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.76);
      if (C.hook) {
        tl.fromTo("#hook", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 0.8);
        tl.fromTo("#shine", { x: 0 }, { x: hook.offsetWidth + 200, duration: 0.7, ease: "power2.inOut" }, 1.5);
      }
      tl.fromTo("#foot", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.85);
      finish(tl, D);
    </script>
  </body>
</html>
