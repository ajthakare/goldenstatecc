[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gscc-highlights"
version = "0.1.0"
description = "Local, zero-quota-burn Instagram Reels highlights generator for Golden State Cricket Club"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "numpy>=1.26.4",
    "opencv-python-headless>=4.10.0.84",
    "openpyxl>=3.1.5",
    "Pillow>=10.4.0",
    "pyobjc-framework-Vision>=10.3.1; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3.1; sys_platform == 'darwin'",
    "PyYAML>=6.0.2",
    "rich>=13.9.0",
    "static-ffmpeg>=2.7",
    "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
gscc-highlights = "gscc_highlights.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gscc_highlights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
