<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <title>GSCC Stream Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      width: 1920px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
    }

    /* Top bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 60px;
      background: transparent;
    }

    /* Club logo */
    .club-logo {
      height: 132px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
    }

    /* Sponsor area */
    .sponsor-area {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .presented-by {
      font-family: 'Arial', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      white-space: nowrap;
    }

    .sponsor-slot {
      position: relative;
      width: 312px;
      height: 120px;
    }

    .sponsor-logo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      filter: drop-shadow(0 1px 4px rgba(0,0,0,0.5));
    }

    .sponsor-logo.active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="top-bar">

    <!-- Club logo (left) -->
    <img
      src="/GSCC_png.png"
      alt="Golden State Cricket Club"
      class="club-logo"
    />

    <!-- Sponsors (right) -->
    <div class="sponsor-area">
      <span class="presented-by">Sponsored by</span>
      <div class="sponsor-slot">
        <img src="/sponsors/dimple-seth.png" alt="Dimple Seth"        class="sponsor-logo" data-index="0" />
        <img src="/sponsors/parktown.png"  alt="Parktown Pizza"     class="sponsor-logo" data-index="2" />
      </div>
    </div>

  </div>

  <script>
    const logos = document.querySelectorAll('.sponsor-logo');
    let current = 0;

    logos[current].classList.add('active');

    setInterval(() => {
      logos[current].classList.remove('active');
      current = (current + 1) % logos.length;
      logos[current].classList.add('active');
    }, 10000);
  </script>

  <script src="/overlay/fit.js"></script>
</body>
</html>
