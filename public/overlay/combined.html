<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <title>GSCC Combined Stream Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      width: 1920px;
      height: 1080px;
      background: transparent !important;
      background-color: rgba(0,0,0,0) !important;
      overflow: hidden;
    }

    #score-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      border: none;
      background: transparent;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>
  <script>
    const params   = new URLSearchParams(window.location.search);
    const topUrl   = params.get('top');
    const scoreUrl = params.get('score');

    async function loadTopOverlay(url) {
      const res  = await fetch(url);
      const html = await res.text();
      const parser = new DOMParser();
      const doc  = parser.parseFromString(html, 'text/html');

      doc.querySelectorAll('style').forEach(styleEl => {
        const cleaned = styleEl.textContent
          .replace(/html\s*,\s*body\s*\{[^}]*\}/gs, '')
          .replace(/html\s*\{[^}]*\}/gs, '')
          .replace(/body\s*\{[^}]*\}/gs, '');
        const newStyle = document.createElement('style');
        newStyle.textContent = cleaned;
        document.head.appendChild(newStyle);
      });

      document.body.insertAdjacentHTML('beforeend', doc.body.innerHTML);

      doc.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        newScript.textContent = oldScript.textContent;
        document.body.appendChild(newScript);
      });
    }

    async function init() {
      if (!topUrl && !scoreUrl) {
        document.body.innerHTML +=
          '<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:Arial;font-size:24px;color:red;background:rgba(0,0,0,0.7);padding:20px 40px;border-radius:8px;text-align:center;">No overlay URLs provided.<br>Use /overlay/generator.html to create a combined link.</div>';
        return;
      }

      if (topUrl) {
        try { await loadTopOverlay(topUrl); }
        catch (e) { console.error('Failed to load top overlay:', e); }
      }

      if (scoreUrl) {
        const frame = document.createElement('iframe');
        frame.id = 'score-frame';
        frame.src = scoreUrl;
        frame.setAttribute('allowtransparency', 'true');
        document.body.appendChild(frame);
      }
    }

    init();
  </script>
  <script src="/overlay/fit.js"></script>
</body>
</html>
