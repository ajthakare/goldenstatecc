[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Function configuration
[functions]
  node_bundler = "esbuild"
  included_files = ["src/types/**/*.ts"]

# @sparticuz/chromium bundles a large Chromium binary; scope it to only the
# one function that needs it so it isn't duplicated into every function's
# bundle (that caused an ENOSPC build failure - out of disk space).
[functions."cricclubs-live-score"]
  external_node_modules = ["@sparticuz/chromium", "puppeteer-core"]

# Redirects for admin panel (SPA-like routing)
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  force = false

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"

# Overlay files may be framed by our own pages (DENY elsewhere)
[[headers]]
  for = "/overlay/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

# Service worker must never be cached — Chrome checks for updates on each load
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Cache static assets
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sponsors/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variables (configure in Netlify UI)
# Required:
# - JWT_SECRET (Session secret - generate with: node docs/scripts/generate-session-secret.cjs)
# - SESSION_SECRET (Alternative name for JWT_SECRET)
# Optional:
# - FIRST_ADMIN_USERNAME (Initial admin setup)
# - FIRST_ADMIN_PASSWORD (Initial admin setup)
# - CLOUDINARY_CLOUD_NAME (If using Cloudinary)
# - CLOUDINARY_API_KEY (If using Cloudinary)
# - CLOUDINARY_API_SECRET (If using Cloudinary)
# - YOUTUBE_API_KEY (YouTube Data API v3 key - for sync-social-feed; no OAuth needed)
# - YOUTUBE_CHANNEL_HANDLE (Optional - defaults to the @handle in SITE_CONFIG.social.youtube.url)
# - INSTAGRAM_APP_SECRET (Only for docs/scripts/bootstrap-instagram-token.cjs --short-lived; the *Instagram* app secret)
